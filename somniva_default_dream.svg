<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A quiet dream landscape</title>
  <desc id="desc">An abstract moonlit landscape with a violet sky, distant mountains, and reflective water.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09091f"/>
      <stop offset="0.48" stop-color="#26205c"/>
      <stop offset="1" stop-color="#10182f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24376a"/>
      <stop offset="1" stop-color="#080d22"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6259af"/>
      <stop offset="1" stop-color="#161536"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.62" stop-color="#f4d98b"/>
      <stop offset="1" stop-color="#c9944d"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="860" cy="190" r="130" fill="#ead58d" opacity="0.12" filter="url(#glow)"/>
  <circle cx="860" cy="190" r="74" fill="url(#moon)"/>
